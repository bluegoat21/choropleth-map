<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>移動しました — Area Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 即時リダイレクト (meta refresh とJSの両方で、検索エンジンにも認識させる) -->
<meta http-equiv="refresh" content="0; url=../area-builder/">
<link rel="canonical" href="../area-builder/">
<style>
  body {
    margin: 0; padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: #1f2937; background: #f7f8fa; text-align: center;
  }
  .card {
    max-width: 480px; margin: 60px auto; padding: 32px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  p { font-size: 14px; color: #4b5563; line-height: 1.7; margin: 0 0 16px; }
  a {
    display: inline-block; padding: 10px 20px; margin-top: 8px;
    background: #3b82f6; color: #fff; text-decoration: none;
    border-radius: 6px; font-weight: 500;
  }
  a:hover { background: #2563eb; }
  code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>📦 ページが移動しました</h1>
  <p>
    このツールは <code>/builder/</code> から <code>/area-builder/</code> に
    移動しました。<br>
    自動的に新しいURLへ転送します...
  </p>
  <a href="../area-builder/">→ Area Builder を開く</a>
</div>
<script>
  // meta refresh のフォールバック (即座にナビゲート)
  location.replace('../area-builder/' + location.search + location.hash);
</script>
</body>
</html>
